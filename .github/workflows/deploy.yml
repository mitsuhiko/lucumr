name: Build and Deploy Blog

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run at 6:00 AM and 6:00 PM UTC daily
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      # the social preview cards draw the header artwork in Node (generator/social_art.js)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Cache blog build
        uses: actions/cache@v4
        with:
          path: blog/_build
          key: blog-build-v2-${{ hashFiles('blog/static/**', 'templates/**') }}
          restore-keys: |
            blog-build-v2-

      # The social preview cards are slow to make (they draw the header
      # artwork), so they have a cache of their own: the newest one is always
      # restored, and the build only makes the cards whose post, artwork code
      # or stylesheet changed (generator/social_preview.py checks each card
      # against social_preview_cache.json).  It is saved under the hash of that
      # file, so a run that made no card saves nothing.
      - name: Restore social preview cards
        uses: actions/cache/restore@v4
        with:
          path: |
            blog/_build/social
            blog/.generator_cache/social_preview_cache.json
          key: social-previews-${{ github.run_id }}
          restore-keys: |
            social-previews-

      - name: Build blog
        run: make build

      - name: Save social preview cards
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            blog/_build/social
            blog/.generator_cache/social_preview_cache.json
          key: social-previews-${{ hashFiles('blog/.generator_cache/social_preview_cache.json') }}

      - name: Copy 404 page for GitHub Pages
        run: cp blog/_build/404/index.html blog/_build/404.html

      - name: Copy CNAME file
        run: cp blog/CNAME blog/_build/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./blog/_build

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
