<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artwork lab</title>
<link rel="stylesheet" href="/static/fonts.css">
<style>
  html { background: #fff; color: #000; }
  html.dark { background: #1b3156; color: #dce7f3; color-scheme: dark; }
  body { margin: 0; font: 13px/1.4 system-ui, sans-serif; }
  nav { padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  nav a { color: inherit; opacity: .6; text-decoration: none; }
  nav a.on { opacity: 1; font-weight: 600; text-decoration: underline; }
  nav span { opacity: .4; }
  #samples { margin: 0 auto; }
  .sample { margin-bottom: 28px; border-top: 1px dashed rgba(128,128,128,.5); }
  .sample .label { padding: 4px 12px; opacity: .7; }
  .sample .label b { font-weight: 600; }
  .header-image { position: relative; width: 100%; height: 150px; overflow: hidden; }
  .footer-image { position: relative; width: 100%; height: 450px; overflow: hidden; }
  .header-image canvas, .footer-image canvas { width: 100%; height: 100%; display: block; }
  .narrow .header-image { height: 100px; }
  .narrow .footer-image { height: 300px; }
  .page { max-width: 740px; margin: 0 auto; padding: 14px 30px 20px; font: 17px/1.7 'Merriweather', serif; }
  .page h1 { font: 600 34px/1.2 'Lora', serif; margin: 0 0 6px; color: #1b3156; }
  html.dark .page h1 { color: #96afda; }
  .page p { margin: 0; opacity: .55; font-size: 14px; }
</style>
</head>
<body>
<nav id="nav"></nav>
<div id="samples"></div>
<script src="core.js"></script>
<script src="data.js"></script>
<script src="posts.js"></script>
<script src="classic.js"></script>
<script src="strata.js"></script>
<script src="sketchbook.js"></script>
<script src="ridgeline.js"></script>
<script src="lab.js"></script>
</body>
</html>
